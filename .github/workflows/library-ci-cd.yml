name: Reusable Library CI/CD Pipeline

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java JDK Version'
        required: false
        type: string
        default: '21'
    secrets:
      ZENTEC_GPR_USER:
        required: false
      ZENTEC_GPR_TOKEN:
        required: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  statuses: write

jobs:
  # =========================================================================
  # JOB 1: Validation of Pull Request Title (Conventional Commits)
  # =========================================================================
  pr-title:
    name: Check PR Title (Semantic PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Validate PR Title Format
        id: pr_title_check
        uses: amannn/action-semantic-pull-request@v5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR if Title Format is Invalid
        if: steps.pr_title_check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          TITLE="${{ github.event.pull_request.title }}"
          REPO="${{ github.repository }}"
          gh pr comment "$PR_NUM" --repo "$REPO" --body "**Invalid Pull Request Title**

          The title \`$TITLE\` does not comply with Conventional Commits specifications.

          **Required Format**: \`<type>: <description>\`
          **Supported Types**: \`feat:\`, \`fix:\`, \`chore:\`, \`docs:\`, \`refactor:\`, \`perf:\`, \`test:\`, \`build:\`, \`ci:\`, \`revert:\`."
          exit 1

  # =========================================================================
  # JOB 2: Build, Unit Testing & JaCoCo Code Coverage Verification
  # =========================================================================
  build-and-test:
    name: Build, Test & JaCoCo Coverage
    runs-on: ubuntu-latest
    needs: pr-title
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Tests & JaCoCo Coverage Verification
        env:
          ZENTEC_GPR_USER: ${{ secrets.ZENTEC_GPR_USER || github.actor }}
          ZENTEC_GPR_TOKEN: ${{ secrets.ZENTEC_GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --continue

      - name: Comment Coverage Report on PR
        uses: madrapps/jacoco-report@v1.6.1
        if: always() && github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "JaCoCo Code Coverage Report"
          pass-emoji: "✅"
          fail-emoji: "❌"
          continue-on-error: false

  # =========================================================================
  # JOB 3: Publish PR Dynamic Snapshot Package to GitHub Packages
  # =========================================================================
  publish-snapshot:
    name: Publish PR Snapshot Package
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Publish Dynamic PR Snapshot Package
        env:
          ZENTEC_GPR_USER: ${{ secrets.ZENTEC_GPR_USER || github.actor }}
          ZENTEC_GPR_TOKEN: ${{ secrets.ZENTEC_GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          SNAPSHOT_VERSION="1.0.0-PR${PR_NUM}-SNAPSHOT"
          echo "Publishing Snapshot Version: ${SNAPSHOT_VERSION}"
          ./gradlew publish -Pversion="${SNAPSHOT_VERSION}"

      - name: Comment Published Snapshot Version on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          SNAPSHOT_VERSION="1.0.0-PR${PR_NUM}-SNAPSHOT"
          gh pr comment "$PR_NUM" --repo "$REPO" --body "**PR Snapshot Package Published**

          Artifact: \`com.zentec:${{ github.event.repository.name }}:${SNAPSHOT_VERSION}\`
          Repository: GitHub Packages (\`zentec-group\`)"

  # =========================================================================
  # JOB 4: Semantic Release (RC on develop, Official Release on main)
  # =========================================================================
  semantic-release:
    name: Semantic Release (RC & Official Release)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set Up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Install Semantic Release Dependencies
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/exec @semantic-release/changelog @semantic-release/github

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZENTEC_GPR_USER: ${{ secrets.ZENTEC_GPR_USER || github.actor }}
          ZENTEC_GPR_TOKEN: ${{ secrets.ZENTEC_GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
